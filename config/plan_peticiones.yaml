# Cada petición del usuario (docs/peticiones_usuario.md) en UN paquete de trabajo del plan (02-11).
# El avance de cada paquete lo calcula scripts/real_status.py desde la auditoría; test_plan_peticiones comprueba que
# ninguna petición queda fuera ni está en dos paquetes. Orden de ejecución: el de esta lista (Base → Medidas →
# Producto); dentro de un paquete, la prueba que lo cierra va en «cierre».
paquetes:
  B1:
    nombre: "Base · velocidad y uso del PC"
    cierre: "Un partido de 3,5 h desde cero en una noche (≤ 8 h) sin perder calidad (10-11, con el usuario); CPU/iGPU por etapa medidas en cada ejecución"
    peticiones: [10, 14, 29, 75, 77, 125, 137, 230, 231, 237]
    prueba: ["^Tiempo desde cero", "^Uso del PC por etapa", "^Peticiones por GitHub Actions", "^Tomas de cámara"]
  B2:
    nombre: "Base · robustez (nada se cuelga, todo se recupera)"
    cierre: "Prueba por cada caso de error y cuelgue; 0 etapas con error en la referencia"
    peticiones: [13, 225, 232]
    prueba: ["^Golpes que fallaron al procesarse", "?^Etapas con errores", "^Partido .*: salida de cada etapa"]
  B3:
    nombre: "Base · mejores modelos (estado del arte medido)"
    cierre: "Cada candidato medido frente al actual (precisión con datos anotados y fotogramas/s en el PC)"
    peticiones: [30, 58, 138, 199, 200, 201, 202, 203, 204, 221]
    prueba: ["^Modelo candidato medido", "^Modelo en uso"]
  B4:
    nombre: "Base · no perder golpes"
    cierre: "Recall F3Set y RacketVision por lado y tipo, sin bajar la precisión"
    peticiones: [23, 151, 155, 205, 218, 219]
    prueba: ["^Golpes encontrados frente a F3Set", "^Tipo de golpe frente a F3Set", "^Golpes encontrados frente al marcador", "^Saques por punto de su saque", "^Golpes inventados: precisión en F3Set", "^Cobertura del saque dicha en el informe"]
  B5:
    nombre: "Base · exportación"
    cierre: "Vídeos por golpe en ≤ 20 min sin cuelgues"
    peticiones: [41]
    prueba: ["^Exportación", "^Vídeos exportados: "]
  B6:
    nombre: "Base · referencia definitiva de los 4 partidos"
    cierre: "4 partidos sin errores de etapa; auditoría generada"
    peticiones: [1, 134, 233, 234]
    prueba: ["^Partido .*: salida de cada etapa", "?^Etapas con errores", "^Golpes que fallaron al procesarse"]
  B7:
    nombre: "Base · aplicación autónoma e infraestructura"
    cierre: "Un partido nuevo de principio a fin sin el ciclo ni el chat; capturas de cada pantalla sin fallos"
    peticiones: [18, 19, 20, 21, 22, 31, 32, 37, 40, 43, 45, 49, 50, 51, 52, 66, 80, 81, 82, 83, 119, 136, 139,
                 144, 145, 146, 152, 160, 161, 220, 222, 226, 227, 229, 241, 242]
    prueba: ["^Aplicación: ventana real", "^Aplicación: análisis en su índice", "^Aplicación: un partido nuevo de principio a fin", "^Pruebas del código en este PC", "^Pruebas en este PC", "^Progreso visible", "^Nada pide revisión manual"]
  B8:
    nombre: "Base · orquestador único (aplicación y chat con el mismo código y los mismos datos)"
    cierre: "Fases A-F de docs/orquestador.md; un trabajo enviado desde el chat, pausado en la aplicación y reanudado desde el chat en el PC"
    peticiones: [246, 247, 248, 249, 250, 251, 259, 260]
    prueba: ["^Orquestador: "]
  P0:
    # 11-11 (usuario): justo después de la Base y antes de las medidas
    nombre: "Producto · rediseño completo de la aplicación (comparativa profesional, UX, aprendizaje, gestión, gráficos)"
    cierre: "Diseño desde la comparativa con las apps profesionales; capturas de cada pantalla comparadas con las de referencia, sin restos inútiles ni nada fijo en el código"
