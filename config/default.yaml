# Valores por defecto. Lo específico de cada equipo va en config/local.yaml.

# Pasada barata (partido entero): resolución y fps reducidos.
cheap_pass:
  width: 640
  fps: 10
  detector: lightweight

# Pasada fina (ventanas de ±window_s alrededor de cada golpe), fps nativos.
fine_pass:
  window_s: 1.0
  # con bola: la ventana empieza antes para incluir el golpe de la rival (tiempo disponible)
  ball_lead_s: 2.2
  # con bola: y termina más tarde para ver dónde bota su golpe en el campo rival
  ball_tail_s: 1.4
  # cascada: con bola, una ventana sin ningún golpe de bola en su lado (y, en el lado cercano, con la
  # bola bien vista junto a cada candidato) no puede dar un golpe confirmado: no se le pasa la pose
  # (src/tennisbio/fine_gate.py). gate_margin_s: margen extra sobre la tolerancia de 0,4 s.
  gate: true
  gate_margin_s: 0.1
  # velocidad sin cambiar las medidas (14-10, docs/pruebas_velocidad.md):
  # - pose_prefetch: la entrada del modelo de pose se prepara en otro hilo y la apariencia en otro,
  #   mientras el modelo trabaja (mismo resultado, comprobado fotograma a fotograma).
  # - racket_near_candidates: la silueta de la raqueta (modelo lento) solo donde la lee un golpe que
  #   puede confirmarse (impacto a ≤ 0,4 s de un candidato); esos golpes ven exactamente lo mismo.
  # - pose_ranges: la pose solo en los fotogramas que usa un golpe posible (de 2,8 s antes a 2,0 s
  #   después de cada impacto que la bola aún permite; fine_gate.pose_keep) y, fuera, uno de cada
  #   pose_fill_every (la jugadora se sigue por toda la ventana y su altura sale como con la ventana
  #   entera). Si cubre ≥ 85 % de la ventana, la ventana entera. «far»: solo en el lado lejano (de
  #   frente, su altura se mide bien; puntos idénticos y medidas en % de altura a ≤ 0,6 puntos en
  #   RacketVision). En el cercano (de espaldas) su altura sale de pocos fotogramas con la cara
  #   visible y cambiaría hasta ~1,5 puntos: no se activa (y apenas ahorra: ventanas cortas).
  pose_prefetch: true
  racket_near_candidates: true
  # apagado tras la prueba 5 en el PC (14-10): con el lado lejano por tramos se posaron 13 178 fotogramas
  # de 12 810 (6 ventanas tuvieron que repetirse enteras) y la pose tardó más (1440 s frente a 1318 s)
  pose_ranges: false
  pose_pre_s: 2.8
  pose_post_s: 2.0
  pose_join_s: 1.0
  pose_full_frac: 0.85
  pose_fill_every: 5
  # Modelo de pose de la pasada fina (lado cercano): hybrid = YOLO11m-pose (media precisión) encuentra a
  # las personas y RTMPose-x Halpe26 (precisión normal) rehace solo a las del tamaño de la jugadora.
  # Medido en el PC (scripts/model_trials.py, docs/estado_del_arte.md): los mismos golpes encontrados,
  # −35 % de temblor de los puntos y los 6 puntos del pie (talones y puntas) vistos en el 99,7 % de los
  # fotogramas, que el apoyo y la base necesitan (el tobillo está ~8-10 cm por encima del suelo).
  # Coste: ~2 veces el tiempo de pose de YOLO en las ventanas del lado cercano. El lado lejano sigue
  # con YOLO (recorte que la sigue; sus pies, de ~70 px, no se usan). yolo = como antes (sin pies).
  # Activado el 14-10: la pasada fina se repite una vez en el PC (nueva clave de caché de las ventanas).
  pose_model: hybrid
  # Escala de su altura en píxeles (todas las medidas en % de altura o en cm; src/tennisbio/body_scale.py):
  # court = la altura real de config/players proyectada con la cámara que da la pista en el sitio donde
  # está (no depende de su postura ni de qué fotogramas se posan); sin pista o si su tronco y sus piernas
  # la contradicen, segments = tronco y piernas con sus proporciones; pose = como antes (nariz → tobillo
  # × 1,08 en los pocos fotogramas en que se le ve la cara: de espaldas leía el 65-95 % de su altura).
  # Los golpes se siguen encontrando con la escala de antes (umbrales validados).
  height_scale: court
  detector: balanced
  pose: performance

# Modelos de rtmlib (ONNX). Halpe26 = 17 puntos COCO + pies (necesarios para el tipo de apoyo).
models:
  detectors:
    lightweight:
      url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_tiny_8xb8-300e_humanart-6f3252f9.zip
      input_size: [416, 416]
    balanced:
      url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_m_8xb8-300e_humanart-c2c7a14a.zip
      input_size: [640, 640]
  poses:
    balanced:
      url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-body7_pt-body7-halpe26_700e-256x192-4d3e73dd_20230605.zip
      input_size: [192, 256]
    performance:
      url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-x_simcc-body7_pt-body7-halpe26_700e-384x288-7fb6e239_20230606.zip
      input_size: [288, 384]

# Dispositivo de inferencia: dml (iGPU con DirectML), cpu u openvino (CPU).
device: dml
# Modelo de pose YOLO en media precisión (solo con device: dml): 2,2 veces más rápido en la iGPU.
# Validado en el PC (scripts/model_trials.py, 13-10): mismos golpes encontrados y puntos a 0,25 px.
fp16: true
# Etapas a la vez: las que usan recursos distintos y ya tienen sus datos se ejecutan juntas
# (jugadoras en la iGPU mientras el marcador hace OCR en la CPU). false: una tras otra, como antes.
pipeline:
  parallel: true
# Decodificador de vídeo en la gráfica: auto (d3d11va en Windows si funciona), d3d11va o null (CPU).
hwaccel: auto

# Cortes de plano: TransNetV2 (licencia MIT; `scripts/export_transnetv2.py`, lo hace setup_models.py)
# sobre fotogramas de 48×27 a 25 fps; los fundidos también con los histogramas de color. Sin el
# modelo (o si falla) se usan solo los histogramas (detecta peor los cortes entre planos de colores
# parecidos: pista azul y primeros planos azules/verdes).
scenes:
  onnx: models/transnetv2.onnx
  threshold: 0.5
  fps: 25

# Seguimiento de bola: TrackNetV3 de RacketVision (licencia MIT), entrenado en tenis de TV.
# Se genera con `uv run python scripts/export_balltrack.py` (descarga los pesos de Hugging Face).
ball:
  onnx: models/balltrack.onnx
  threshold: 0.5
  # en la iGPU (device: dml), lote fijo de 8 (el último de cada ventana se rellena y se descarta lo
  # añadido): DirectML compila la red para una sola forma. Mismo mapa de calor por fotograma.
  # apagado tras la prueba 5 en el PC (14-10): la bola no fue más rápida en DirectML (1394 s frente a 1332 s)
  static_batch: false

# Orientación de las cuerdas en la pasada fina: 5 puntos de la raqueta (RacketVision,
# `scripts/export_racketpose.py`) y, si está, la mano/antebrazo en 3D (RTMW3D, más lento:
# se evalúa uno de cada `hand3d_step` fotogramas).
racket_face:
  enabled: true
  pose_onnx: models/racketpose.onnx
  hand3d_onnx: models/rtmw3d-x.onnx
  hand3d_step: 2

# Analizar también a la rival con los mismos vídeos (planos en los que ella está en el lado
# cercano). Su perfil: `opponent_id` en matches.yaml → config/players/<opponent_id>.yaml.
analyze_opponent: false
