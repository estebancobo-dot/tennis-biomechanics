# Catálogo de referencias para el rediseño (P0.3, petición #257; 15-11)
#
# Una entrada por producto, sistema o fuente que enseña o mide golpes. Sirve para diseñar las pantallas de P0
# (`docs/p0_pantallas.md`) con patrones probados y para ver los huecos. Lo resume `docs/comparativa_completa.md`.
#
# Campos:
#   tipo: profesional | retransmision | aficionado | entrenador (herramienta de vídeo) | laboratorio | github | youtube
#   fuente: de dónde salen sus datos; mide: qué mide; ensena: cómo lo explica; graficos; plataforma; precio
#   patrones: claves de `patrones` (abajo) que usa
#   casillas: 0-3 en cada criterio (abajo); evidencia: ficha (su descripción pública o prensa) | visto (capturas o
#     fotogramas analizados) | probado (usado). Ninguna entrada está «probada»: las notas son de su descripción.
#   fuentes: enlaces consultados (fecha de la consulta en `consulta`)
#
# Criterios (salen de los requisitos 2 y 3 de CLAUDE.md):
#   video: el vídeo real es la prueba de cada dato
#   fases: el golpe dividido en fases, cada una con su fotograma
#   pocos_numeros: pocos números bien elegidos, cada uno explicado
#   comparar: dos golpes lado a lado o superpuestos, sincronizados
#   explica: dice qué hacer y cómo (consigna, error típico, ejercicio)
#   fiabilidad: enseña la incertidumbre o lo que no puede medir
#   movil: hecho para el móvil
#   automatico: sin anotar ni marcar nada a mano

consulta: "2026-11-15"

criterios: [video, fases, pocos_numeros, comparar, explica, fiabilidad, movil, automatico]

patrones:
  video_capas: {nombre: "Vídeo con capas (esqueleto, raqueta, bola) sobre la imagen real", adopta: si}
  fotogramas_clave: {nombre: "Fotogramas clave por fase (las «posiciones» del golf, P1-P10)", adopta: si}
  lado_a_lado: {nombre: "Dos golpes lado a lado, sincronizados por el impacto", adopta: si}
  angulo_dibujado: {nombre: "La medida dibujada sobre el fotograma donde se mide (arco del ángulo, regla)", adopta: si}
  cadena_cinetica: {nombre: "Gráfico de la cadena cinética: el pico de cada segmento en el tiempo", adopta: si, nota: "el orden de los picos es fiable; sus valores, no (CLAUDE.md, fiabilidad)"}
  mapa_pista: {nombre: "Mapa de pista con botes e impactos", adopta: si}
  resumen_tarjetas: {nombre: "Resumen del partido en tarjetas cortas (frase + dato + vídeo)", adopta: si}
  circulo_y_frase: {nombre: "Un círculo sobre lo que importa y una frase corta sobre el vídeo", adopta: si}
  real_y_lento: {nombre: "Primero a velocidad real, después a cámara lenta y fotograma a fotograma", adopta: si}
  lo_que_copiar: {nombre: "Cierre en 3-4 puntos «lo que puedes copiar»", adopta: si}
  puntuacion_unica: {nombre: "Una puntuación única del golpe (0-10, 0-100, parecido a un profesional)", adopta: "no", motivo: "no está validada para vídeo de TV (CLAUDE.md, galerías: no hay puntuación de «mejor técnica»); una nota inventaría precisión"}
  comparar_con_profesional: {nombre: "Tu golpe comparado con el de un profesional", adopta: "no", motivo: "aquí la profesional es la analizada y no se usan vídeos del usuario (requisito 6)"}
  dibujo_y_voz: {nombre: "El entrenador dibuja y graba su voz sobre el vídeo", adopta: "no", motivo: "100 % automático: nadie anota (requisito 5)"}
  chat: {nombre: "Preguntar en lenguaje natural sobre el análisis", adopta: hueco, peticion: 299}
  avatar_3d: {nombre: "Muñeco 3D del golpe que se gira para verlo desde cualquier lado", adopta: hueco, peticion: 300, nota: "solo como estimación marcada (2D desde una cámara)"}
  realidad_aumentada: {nombre: "Gráficos en directo sobre la retransmisión", adopta: "no", motivo: "se analiza después, no en directo"}

