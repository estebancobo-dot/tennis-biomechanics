# Paso 8 (14-11, #281-#283): la cola de trabajos de la nube. La lee el flujo «Cola» de GitHub Actions cada 30 minutos
# (cloud/cola.py), sin ninguna sesión de chat; el estado de cada trabajo, el gasto y un resumen van a la rama nube-logs
# (cola/estado.md). Cada trabajo se lanza en la primera fuente gratuita con sitio: Kaggle (horas de GPU de la semana),
# Modal (crédito del mes, nunca por encima del tope) o el PC (si está encendido); si ninguna tiene sitio, espera con el
# motivo escrito y la cola sigue con los demás.
#   id:            nombre del trabajo (letras, números, _ . -)
#   accion:        prueba (10 min de un partido) | partido (el partido entero) | informe (informe y auditoría de la Base)
#                  | medir (una prueba de concepto, con «prueba: <nombre>», en Kaggle)
#   partido:       el id del partido en la nube (los válidos, en nube-logs:cola/partidos.json)
#   minutos_video: la duración del vídeo (para prever el gasto; si falta, 210)
#   tras:          otro trabajo que tiene que haber acabado bien antes
#   donde:         cualquiera (por defecto) | kaggle | modal | pc
#   aprobado:      true solo si el usuario aprobó ese análisis completo (#262); un «partido» sin él no se lanza
# Lo usado en Modal en cada mes antes de los trabajos de esta cola (la cifra de su página Usage; Claude la pone al día
# cuando el usuario la da): 14-11 07:20 UTC, 28,05 $ + el informe de las 07:31 (0,03 $)
# Kaggle como fuente de la cola (paso 8b): se activa cuando su prueba de 10 min da lo mismo que la de Modal
# 14-11 13:20: Gauff, 10 min: las mismas tomas, pista, 55 golpes (34 cerca, 21 lejos), enlaces y fallos que Modal; 18
# derechas frente a 19 (la bola calculada en la CPU, que ya no se usa con menos de 8 núcleos): activado
kaggle_activo: true
# 14-11 (#287): los partidos enteros esperan a la fase B de la nube nativa (docs/nube_nativa.md: decodificar en la GPU,
# TensorRT, las 2 T4; los mismos resultados en menos tiempo); Kaggle queda para las pruebas y las medidas. Vacío = sin espera
# 14-11 22:20: liberados. La fase B dio lo que da en Kaggle sin cambiar resultados (v19 idéntica a la v16b: el
# dispositivo por descubrimiento, la subida sin pérdidas y las 2 T4, −8,5 % de tiempo; la CPU de 4 núcleos es el
# límite). Lo que se acelere después (CPU de la pasada fina, T19) se comprueba con su prueba y vale para lo que falte
# 14-11 23:55 (T23, docs/herencia_pc.md): esperan a decidir la calidad en la nube (precisión completa y el 3D de la
# mano en cada fotograma, decididos así por el tiempo del PC): si cuesta ≤ 15 % más, se adopta antes de Gauff
# 15-11 00:55: decidido con la regla escrita antes de medir: la precisión completa y el 3D en cada fotograma cuestan
# +16,8 % (> 15 %) sin prueba de que midan mejor: no se adoptan. Partidos liberados (R50, medidas de la cara que
# saltan 180°, se arregla aparte: rehace solo las medidas desde las cachés de las ventanas)
# 15-11 05:45 (#295, decisión del usuario): los partidos que faltan esperan a la nube nativa entera (fase C: cada modelo
# medido en la nube), para analizar cada uno una sola vez con lo elegido; Gauff y la final, en marcha, terminan
# 21-11 21:10 (#310, el usuario: «Sí. Y avanza en paralelo»): los partidos ya, sin esperar al 3D ni a F3Set (si MeTRAbs
# gana, solo se recalcula el giro 3D desde la pose guardada; si F3Set señala una causa, se arregla antes de los siguientes)
partidos_en_espera: ""
# trabajos que empiezan de nuevo, una vez cada «id#n»: la final se lanzó en Kaggle a las 14:32 y Kaggle no la arrancó
reiniciar: ["final#1"]
# trabajos cancelados (su sesión de Kaggle se libera; acaban en «error» con el motivo). 14-11 21:10: la fase A midió la
# GPU ocupada el 9 % de la pasada fina, así que TensorRT apenas ahorraría hoy; su plaza, para la v19 (las 2 T4)
cancelar:
  sinner_b: "22-11 00:05: relanzado a las 00:04 con el giro 3D de antes; MeTRAbs acaba de pasar su regla (comparar_gauff_v36_v38: los mismos 28 golpes, X-factor 3D en 15 frente a 7, dispersión 5,2° frente a 5,6°) y Sinner se analiza una sola vez con lo elegido (#295): otra vez como sinner_b2 cuando MeTRAbs sea el de por defecto"
  medir_f3set_hoy_c: "21-11 23:58: corre dos veces en Kaggle (cada vuelta caída de 23:01 a 23:31 lo volvió a lanzar: dos versiones, dos sesiones de GPU; Kaggle contó 1,78 h en una hora) y deja a sinner_b sin GPU. Se borra su cuaderno y va otra vez detrás de Sinner como medir_f3set_hoy_d"
  medir_raqueta_trt: "la GPU está ocupada solo el 9 % de la pasada fina (fase A, v17): TensorRT casi no ahorra hoy; su plaza de Kaggle, para la v19 (las 2 T4). Se repite si la GPU pasa a ser el cuello de botella"
  prueba_gauff_v18: "la v19 comprueba lo mismo (el dispositivo y la subida) y además las 2 T4: 0,9 h de cuota ahorradas y una plaza libre; si la v19 sale distinta, se repite para aislar la causa"
  gauff: "R48: con la raqueta en la CPU su pasada fina gastaría ~6 h de más; se relanza como gauff_b con el arreglo cuando la v20 lo compruebe (su pasada barata, ya en Modal, se reutiliza)"
  comparar_gauff_v16b_v18: "sin la v18 (ver arriba)"
  prueba_sinner: "#295: la prueba corta de un partido espera con su partido a la nube nativa (comprueba el código con el que se analizará); se repite entonces como prueba_sinner_b"
  prueba_gauff_v29_c: "T24 (15-11 20:00): las partes no reutilizan lo de la anterior: la huella de un modelo lleva la fecha de su fichero y cada sesión lo baja de Modal con fecha nueva (v29_b repitió los cortes; v29_c los repetía otra vez y seguiría con lo de GPU en la CPU). Se arregla la huella (por contenido) y la prueba se repite como v30"
  comparar_gauff_v26_v29: "sin la v29_c (ver arriba)"
  prueba_gauff_v30_c: "T24 (15-11 21:00): la v30_b también repitió los cortes (122 s, velocidad de GPU, frente a los 516 s de la v30_a en CPU): queda otra causa además de R55; la v30_c en la CPU repetiría lo de GPU. Se diagnostica con leer_v30"
  comparar_gauff_v26_v30: "sin la v30_c (ver arriba)"
  prueba_gauff_v31_c: "T24 (15-11 22:35): la parte c (CPU) repetía players en la CPU: la huella de players y de la pasada fina lleva fp16 solo en GPU (uses_fp16), así que en CPU no coincidía con lo de la parte b. Se cancela antes de que suba un players de CPU; se arregla (una parte usa lo que hizo la anterior) y se repite solo la parte c"
  comparar_gauff_v26_v31: "sin la v31_c (ver arriba); se compara con la parte c repetida"
  comparar_gauff_v26_v34: "sin la v34: se paró a los 5 min sin modelos (el ONNX de Sapiens2 se subió junto a /models/models/ y tapó los demás; arreglado); se compara con la v35"
  medir_3d_metrabs_b: "21-11 13:10: 2 h en cola de Kaggle sin GPU libre (no empezó): su plaza, para comprobar la P100 (medir_raqueta_p100); se lanza otra vez en la GPU que sirva"
  medir_f3set_hoy: "21-11 14:25: sus 3 cuadernos se quedaron «en cola» en Kaggle (desde las 10:16) mientras trabajos lanzados después arrancaban al momento; el mismo trabajo con otro nombre (medir_f3set_hoy_b) dice si es el cuaderno o el trabajo"
  prueba_gauff_v38_b: "21-11 20:45: sus 2 cuadernos, en cola de Kaggle desde las 15:36 sin arrancar (desde las 19:20 sin nada más en marcha): otra vez como prueba_gauff_v38_b2"
  medir_bola_totnet: "T15 (15-11 23:20): en CPU no cabe en las 12 h de una sesión de Kaggle: cada clip de RacketVision tiene 600 fotogramas a 60 fps (300 ventanas de TOTNet) y cada ventana tarda unos 6 s en la CPU, unas 20 h para los 40 clips (calculé mal 3-5 h); se cortaría sin resultado. Se repite en GPU (medir_bola_totnet_gpu), con la misma regla"
