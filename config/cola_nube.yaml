# Paso 8 (14-11, #281-#283): la cola de trabajos de la nube. La lee el flujo «Cola» de GitHub Actions cada 30 minutos
# (cloud/cola.py), sin ninguna sesión de chat; el estado de cada trabajo, el gasto y un resumen van a la rama nube-logs
# (cola/estado.md). Cada trabajo se lanza en la primera fuente gratuita con sitio: Kaggle (horas de GPU de la semana),
# Modal (crédito del mes, nunca por encima del tope) o el PC (si está encendido); si ninguna tiene sitio, espera con el
# motivo escrito y la cola sigue con los demás.
#   id:            nombre del trabajo (letras, números, _ . -)
#   accion:        prueba (10 min de un partido) | partido (el partido entero) | informe (informe y auditoría de la Base)
#                  | medir (una prueba de concepto, con «prueba: <nombre>», en Kaggle)
#   partido:       el id del partido en la nube (los válidos, en nube-logs:cola/partidos.json)
#   minutos_video: la duración del vídeo (para prever el gasto; si falta, 210)
#   tras:          otro trabajo que tiene que haber acabado bien antes
#   donde:         cualquiera (por defecto) | kaggle | modal | pc
#   aprobado:      true solo si el usuario aprobó ese análisis completo (#262); un «partido» sin él no se lanza
# Lo usado en Modal en cada mes antes de los trabajos de esta cola (la cifra de su página Usage; Claude la pone al día
# cuando el usuario la da): 14-11 07:20 UTC, 28,05 $ + el informe de las 07:31 (0,03 $)
# Kaggle como fuente de la cola (paso 8b): se activa cuando su prueba de 10 min da lo mismo que la de Modal
# 14-11 13:20: Gauff, 10 min: las mismas tomas, pista, 55 golpes (34 cerca, 21 lejos), enlaces y fallos que Modal; 18
# derechas frente a 19 (la bola calculada en la CPU, que ya no se usa con menos de 8 núcleos): activado
kaggle_activo: true
# 14-11 (#287): los partidos enteros esperan a la fase B de la nube nativa (docs/nube_nativa.md: decodificar en la GPU,
# TensorRT, las 2 T4; los mismos resultados en menos tiempo); Kaggle queda para las pruebas y las medidas. Vacío = sin espera
partidos_en_espera: "después de la fase B de la nube nativa (#287, docs/nube_nativa.md)"
# trabajos que empiezan de nuevo, una vez cada «id#n»: la final se lanzó en Kaggle a las 14:32 y Kaggle no la arrancó
reiniciar: ["final#1"]
# #291 (14-11): el PR buzón (nunca se fusiona): la cola comenta en él solo cuando algo necesita a Claude, y su
# actividad despierta la sesión al momento (sin sondeos ni tokens mientras no pasa nada)
avisos_pr: 1
gasto_modal_base:
  "2026-11": 28.08
trabajos:
  # pruebas de concepto de la nube nativa (#287, #288; docs/nube_nativa.md T6): no esperan a nada
  - {id: medir_raqueta_trt, accion: medir, prueba: raqueta, donde: kaggle}
  # T7 (14-11): decodificar las ventanas en la CPU frente a NVDEC, sobre la retransmisión de Gauff
  - {id: medir_video_nvdec, accion: medir, prueba: video, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, donde: kaggle}
  # T4/T9 (14-11, #289): la misma prueba de 10 min de Gauff con el dispositivo por descubrimiento («device: auto», sin
  # el parche dml→CUDA) y su comparación con la v16b (la última con el parche); si es idéntica o equivalente, el cambio
  # conserva la huella de la pasada fina (config/codigo_equivalente.json) y nada de lo ya analizado se repite
  - {id: prueba_gauff_v17, accion: prueba, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, donde: kaggle}
  # 14-11 19:47: la primera comparación dijo «idéntica» (16 etapas con el mismo contenido) sin haber leído el
  # strokes.json de la v17 y emparejando por una clave de tiempo que no existe: no vale; se repite con la herramienta
  # corregida (empareja por match_time_s; un fichero leído en un solo lado es «incompleta»)
  # 20:02 (R44): «incompleta»: el strokes.json de la v17 nunca llegó a Modal (la subida final no esperaba a la
  # periódica y un fichero se marcaba como subido antes de subirlo); arreglado: otra prueba con el arreglo (v18) y su
  # comparación con la v16b (compara a la vez el cambio de dispositivo y que la subida ya no pierde nada)
  - {id: prueba_gauff_v18, accion: prueba, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, donde: kaggle}
  - {id: comparar_gauff_v16b_v18, accion: comparar, a: "/kaggle_pruebas/output/_prueba_tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5", b: prueba_gauff_v18}
  # lotes 3 y 4 (aprobados por el usuario el 13-11: Osaka; Pegula y Zheng; Gauff y la final; Zverev-Sinner), cada
  # partido tras su prueba corta de 10 minutos (#277); el informe y la auditoría de la Base al final
  - {id: prueba_gauff, accion: prueba, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5}
  # 14-11 (R40): la prueba de Modal leyó 0 marcadores («Usa»); otra prueba con el marcador v16, en Kaggle, antes del partido
  # 14-11 14:32: prueba_gauff_v16 se dio por fallida tras 4 relanzamientos en 45 min con Kaggle sin arrancarla (sus GPU
  # ocupadas; relanzar la mandaba al final de su cola): otra vez, ya esperando sin relanzar
  - {id: prueba_gauff_v16, accion: prueba, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, donde: kaggle}
  - {id: prueba_gauff_v16b, accion: prueba, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, donde: kaggle}
  - {id: gauff, accion: partido, partido: tennis-yusipopen-polufinal-gauff-rybakina-10-09-2026-1080r-5, tras: prueba_gauff_v16b, aprobado: true, minutos_video: 133}
  - {id: prueba_final, accion: prueba, partido: tennis-yusipopen-final-sobolenko-rybakina-12-09-2026-1080r-5}
  - {id: final, accion: partido, partido: tennis-yusipopen-final-sobolenko-rybakina-12-09-2026-1080r-5, tras: prueba_final, aprobado: true}
  - {id: prueba_sinner, accion: prueba, partido: zverev-alexander-sinner-jannik-indian-wells-2026-semi-final, tras: final}
  - {id: sinner, accion: partido, partido: zverev-alexander-sinner-jannik-indian-wells-2026-semi-final, tras: prueba_sinner, aprobado: true}
  # paso 10: Osaka, Pegula y Zheng al día con el código final (marcador v16, R36, R37): solo lo que cambió, desde lo
  # guardado en Modal (las ventanas no se repiten); aprobado en el plan (paso 10 de docs/estado_proyecto.md)
  - {id: actualizar_osaka, accion: partido, partido: us-open-2026-r4-naomi-osaka-elena-rybakina, tras: sinner, aprobado: true, minutos_video: 70}
  - {id: actualizar_pegula, accion: partido, partido: elena-rybakina-jessica-pegula-miami-2026-quarter-final, tras: actualizar_osaka, aprobado: true, minutos_video: 112}
  - {id: actualizar_zheng, accion: partido, partido: zheng-qinwen-elena-rybakina, tras: actualizar_pegula, aprobado: true, minutos_video: 117}
  - {id: informe_6, accion: informe, tras: actualizar_zheng}
