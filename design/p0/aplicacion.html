<style>
/* Desktop application for the PC (#301): navigation in a left column (Ver, Gestionar, Sistema); an analysis opens its
   viewer (Lección, Sus golpes, Más). Built from docs/p0_diseno.md and the inventory of every request. */
:root {
  --bg: #eef2f6; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #0f1e2e; --muted: #57687b; --line: #d6dee8;

  --good: #2b7a4b; --good-soft: #def0e5; --warn: #9a6614; --warn-soft: #f6ead3; --crit: #a83434; --crit-soft: #f6dddd;
  --frame-a: #234f86; --frame-b: #3c7a5e; --draw: #7cf06a; --draw-2: #ff5a4f;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Inter", system-ui, "Segoe UI", sans-serif; --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1520; --surface: #13212f; --surface-2: #182a3b; --ink: #e5edf5; --muted: #9aabbd; --line: #26394d;
  --court: #6b9be0; --court-soft: #1c3350; --court-2: #5aa57f; --ball: #d6e64a; --ball-ink: #2a3000;
  --good: #6cc08f; --good-soft: #17352a; --warn: #e2b061; --warn-soft: #3a2e17; --crit: #ec8a8a; --crit-soft: #3d1f22;
  --frame-a: #1a3b66; --frame-b: #24543f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1520; --surface: #13212f; --surface-2: #182a3b; --ink: #e5edf5; --muted: #9aabbd; --line: #26394d;
  --court: #6b9be0; --court-soft: #1c3350; --court-2: #5aa57f; --ball: #d6e64a; --ball-ink: #2a3000;
  --good: #6cc08f; --good-soft: #17352a; --warn: #e2b061; --warn-soft: #3a2e17; --crit: #ec8a8a; --crit-soft: #3d1f22;
  --frame-a: #1a3b66; --frame-b: #24543f; color-scheme: dark }
* { box-sizing: border-box }

nav.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: grid; align-content: start; gap: 14px }
.brand { font-family: var(--display); font-weight: 700; font-size: 23px; padding-left: 8px } .brand span { color: var(--court) }
.group { display: grid; gap: 2px } .group .eyebrow { padding: 0 10px 4px }
.nav { border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--muted); text-align: left; width: 100% }

main { min-width: 0 }

.chip[aria-pressed="true"] .c { color: var(--surface); opacity: .8 }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: -13px }
.tab { border: 0; background: none; padding: 8px 14px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent }
.tab[aria-current="page"] { color: var(--court); border-bottom-color: var(--court) }

.list { display: grid; gap: 0 }

.row:first-child { border-top: 0 }
.row .t { font-weight: 600 } .row .s { color: var(--muted); font-size: 12.5px }
.clickable { cursor: pointer } .clickable:hover { background: var(--surface-2) }
.mock { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 0 }

.bar.warn i { background: var(--warn) } .bar.crit i { background: var(--crit) }

table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line) }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top }
.scroll { overflow-x: auto }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--court-soft); color: var(--court); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none }
.avatars { display: flex; gap: 6px; align-items: center }

/* frame placeholder with one automatic drawing */
.frame { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, var(--frame-b) 0 20%, var(--frame-a) 20% 100%) }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100% }
.frame .tag { position: absolute; left: 10px; top: 10px; background: rgb(8 18 30 / .6); color: #f1f5fa; font-size: 11px; border-radius: 6px; padding: 3px 8px }
.frame .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 22px; color: #fff; text-shadow: 0 2px 6px rgb(0 0 0 / .6); padding: 0 16px }
.frame .cap em { font-style: normal; color: var(--ball) }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px }

/* lesson */
.strip { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px }
.ph { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0; overflow: hidden; text-align: left; position: relative }
.ph .mini { aspect-ratio: 4/3; background: linear-gradient(180deg, var(--frame-b) 0 22%, var(--frame-a) 22% 100%) }
.ph .nm { padding: 6px 8px; font-size: 12px; font-weight: 600; line-height: 1.25 }
.ph[aria-current="page"] { border-color: var(--court); box-shadow: 0 0 0 2px var(--court) inset }
.ph .start { position: absolute; top: 6px; right: 6px; background: var(--ball); color: var(--ball-ink); font-size: 10px; font-weight: 700; border-radius: 6px; padding: 1px 6px }
.lesson { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start }
.focus { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.2 }
.focus em { font-style: normal; color: var(--court) }
.key { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px }
.key-h { display: flex; gap: 10px; align-items: baseline; justify-content: space-between }
.key .v { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1 }
.key .v small { font-size: 14px; color: var(--muted); margin-left: 2px }
.key .how { margin: 0 }
.key .pb { margin: 0; font-size: 13px; color: var(--muted) }
.practice { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px }
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px }
details.fold > summary { cursor: pointer; padding: 11px 0; font-weight: 600 }
details.fold > div { padding: 0 0 14px }
.chart { width: 100%; height: auto; display: block }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body) }
.chart .lab { fill: var(--ink); font-size: 12px }
.chart .grid { stroke: var(--line) } .chart .bar { fill: var(--court-soft) } .chart .dot { fill: var(--court) }
.chart .imp { fill: var(--ball); stroke: var(--ball-ink); stroke-width: 1.2 }

/* strokes */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.vcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; text-align: left; padding: 0 }
.vcard .frame { border-radius: 0 }
.vcard .meta { padding: 9px 11px; display: grid; gap: 4px }
.vcard .meta b { font-size: 13.5px }
.vcard .meta span { font-size: 12px; color: var(--muted) }
.drawer { position: fixed; inset: 0; z-index: 30; background: rgb(5 12 20 / .45); display: grid; justify-items: end }
.drawer > div { background: var(--bg); height: 100%; overflow-y: auto; width: min(980px, 94vw); padding: 20px 26px 40px; display: grid; gap: 18px; align-content: start; border-left: 1px solid var(--line) }
.drawer-h { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.moments { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.moment .frame { aspect-ratio: 4/3 }
.moment b { display: block; font-size: 13px; margin-top: 6px } .moment span { color: var(--muted); font-size: 12px }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px }
.hbar .track { height: 12px; background: var(--surface-2); border-radius: 99px; position: relative }
.hbar .track i { position: absolute; top: 0; bottom: 0; background: var(--court); border-radius: 99px }
.hbar .track i.up { background: var(--good) }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--court-soft); color: var(--court); font-weight: 700; font-size: 12.5px }
.stepper { display: flex; gap: 6px; flex-wrap: wrap }
.stepper .chip[aria-current="step"] { background: var(--court); color: var(--surface); border-color: var(--court) }
.court svg { width: 100%; max-width: 380px; display: block; margin: 0 auto }
.court .surf { fill: var(--court) } .court .outer { fill: var(--court-2) } .court .ln { stroke: #f4f7fb; stroke-width: .06; fill: none }
.court .net { stroke: #f4f7fb; stroke-width: .12 } .court .p { fill: var(--ball); stroke: var(--ball-ink); stroke-width: .05 } .court .p.out { fill: var(--crit) }
.matrix td.cell { text-align: center; cursor: pointer; font-variant-numeric: tabular-nums }
.matrix td.cell:hover { outline: 2px solid var(--court); outline-offset: -2px }
@media (max-width: 1150px) { .strip { grid-template-columns: repeat(5, minmax(0, 1fr)) } .lesson { grid-template-columns: 1fr } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (prefers-reduced-motion: no-preference) { .nav, .chip, .tab, .vcard, .ph { transition: background-color .15s, border-color .15s } }
</style>

  <nav class="side" aria-label="Secciones">

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isN = v => typeof v === "number" && isFinite(v);
const fmt = (v, d = 0) => isN(v) ? v.toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—";
const sgn = (v, d = 0) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), d);
const P = D.player, PNAME = P.name, STROKE_ES = { forehand: "Derecha", backhand: "Revés", serve: "Saque" }[D.stroke] || D.stroke;
const MET = D.metrics, dec = k => (MET[k] && isN(MET[k].dec)) ? MET[k].dec : 0, unit = k => (MET[k] || {}).unit || "";
const relPill = k => { const m = MET[k] || {}; if (m.est) return `<span class="pill est">estimada</span>`; return m.rel >= 3 ? `<span class="pill good">fiable</span>` : m.rel === 2 ? `<span class="pill warn">media</span>` : `<span class="pill crit">baja</span>`; };
const verdictPill = v => !v ? "" : /fiable/.test(v) ? `<span class="pill good">${esc(v)}</span>` : /ruid|sesgo|no fiable/.test(v) ? `<span class="pill crit">${esc(v)}</span>` : `<span class="pill warn">${esc(v)}</span>`;
const CONF = c => /fiable|real/.test(c) ? "good" : /estimada|baja/.test(c) ? "est" : "warn";
const initials = n => String(n || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const matchLabel = m => [m.torneo, m.ronda].filter(Boolean).join(" · ") || "Torneo sin leer del nombre";
const MATCHES = D.matches;
const playerOf = id => D.players.find(p => p.id === id);

// ---------------- icons and navigation
const IC = {
  inicio: '<path d="M4 11 12 4l8 7v9H4z"/>', analisis: '<path d="M5 19c3-1 4-4 5-7s3-6 7-7"/><circle cx="17.5" cy="5.5" r="2.5"/>',
  partidos: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>', personas: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.4 3-5 6-5s5.2 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/>',
  cola: '<path d="M4 6h16M4 12h16M4 18h10"/>', calidad: '<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  almacen: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>'
};
const SCREENS = { ver: [["inicio", "Inicio"], ["analisis", "Análisis"]], gest: [["partidos", "Partidos"], ["personas", "Personas"]], sis: [["cola", "Cola de la nube"], ["calidad", "Calidad"], ["almacen", "Almacenamiento"], ["ajustes", "Ajustes"]] };
let SCREEN = "inicio";
function navHtml(list) { return list.map(([k, t]) => `<button class="nav" type="button" data-go="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${t}${k === "cola" ? `<span class="count num">${D.queue.jobs.filter(j => j.estado === "en_marcha").length}</span>` : ""}</button>`).join(""); }
$("nav-ver").innerHTML = navHtml(SCREENS.ver); $("nav-gest").innerHTML = navHtml(SCREENS.gest); $("nav-sis").innerHTML = navHtml(SCREENS.sis);
document.querySelector("nav.side").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
function go(s) { if (location.hash !== "#" + s) location.hash = s; else show(s); }
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
function show(s) {
  SCREEN = s || "inicio";
  document.querySelectorAll(".nav").forEach(b => b.toggleAttribute("aria-current", b.dataset.go === SCREEN || (SCREEN === "visor" && b.dataset.go === "analisis")));
  document.querySelectorAll(".nav[aria-current]").forEach(b => b.setAttribute("aria-current", "page"));
  closeDrawer();
  (RENDER[SCREEN] || RENDER.inicio)();
  window.scrollTo(0, 0);
}
const top_ = (title, sub, actions = "", extra = "") => { $("top").innerHTML = `<div class="top-row"><div class="grow"><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${actions}</div>${extra}`; };

// ---------------- management screens
const RENDER = {};
const running = () => D.queue.jobs.filter(j => j.estado === "en_marcha");
function jobLabel(j) {
  const m = MATCHES.find(x => x.id === j.partido), who = m ? `${matchLabel(m)} (${people(m).join(" – ")})` : "";
  const kind = { partido: "Análisis del partido", prueba: "Prueba de 10 min", informe: "Informe", comparar: "Comparación", medir: "Prueba de concepto", leer: "Lectura de diagnóstico" }[j.accion] || j.accion;
  return `${kind}${who ? " · " + who : ""}`;
}
const pending = () => D.queue.jobs.filter(j => j.estado === "pendiente");
RENDER.inicio = () => {
  top_("Inicio", "Lo que pasa ahora, lo que necesita algo de ti y lo último terminado.", `<button class="btn primary" type="button" data-add>Añadir partidos</button>`);
  const k = D.queue.kaggle, run = running();
  $("content").innerHTML = `
  <div class="grid3">
    <div class="card"><span class="eyebrow">Ahora en la nube</span>
      ${run.length ? run.map(j => `<div class="row"><div><div class="t">${esc(jobLabel(j))}</div><div class="s">${esc(j.id)}</div><div class="s">${esc(j.nota)}</div></div><span class="pill est">${esc(j.donde)}</span></div>`).join("") : `<p class="sub">Nada en marcha.</p>`}
    </div>
    <div class="card"><span class="eyebrow">Necesita algo de ti</span>
      <div class="row"><div><div class="t">Clic de identidad</div><div class="s">Ningún partido nuevo lo espera.</div></div><span class="pill good">nada</span></div>
      <div class="row"><div><div class="t">Aprobar análisis</div><div class="s">Sinner y poner al día Osaka, Pegula y Zheng: esperan a acabar la nube nativa. Se pedirá con el tiempo y la cuota previstos.</div></div><span class="pill warn">más adelante</span></div>

function situaciones() {
  const cls = ["abierto", "semiabierto", "neutro", "cerrado"];
  $("sub").innerHTML = `<div class="card scroll" style="margin-top:12px"><h3>Apoyo en el impacto según la situación</h3><p class="sub">Cada celda abre sus golpes (como la matriz de Sportscode).</p><table class="t matrix"><tr><th>Situación</th>${cls.map(c => `<th>${c}</th>`).join("")}<th>Total</th></tr>
  ${D.situations.map(s => { const g = D.strokes.filter(keep[s.id]); return `<tr><td><b>${esc(s.label)}</b></td>${cls.map(c => { const n = g.filter(x => x.stance === c).length; return `<td class="cell" data-cell="${s.id}|${c}">${n}<div class="sub">${g.length ? fmt(100 * n / g.length) + " %" : ""}</div></td>`; }).join("")}<td class="num">${g.length}</td></tr>`; }).join("")}</table></div>`;
}
function pista() {
  const a = D.strokes.filter(keep[SIT]), HL = 11.885, SW = 4.115, DW = 5.485, SL = 6.4;
  let g = `<rect class="outer" x="-6.5" y="-13.5" width="13" height="31"/><rect class="surf" x="${-DW}" y="${-HL}" width="${2 * DW}" height="${2 * HL}"/><rect class="ln" x="${-DW}" y="${-HL}" width="${2 * DW}" height="${2 * HL}"/><line class="ln" x1="${-SW}" x2="${-SW}" y1="${-HL}" y2="${HL}"/><line class="ln" x1="${SW}" x2="${SW}" y1="${-HL}" y2="${HL}"/><line class="ln" x1="${-SW}" x2="${SW}" y1="${-SL}" y2="${-SL}"/><line class="ln" x1="${-SW}" x2="${SW}" y1="${SL}" y2="${SL}"/><line class="ln" x1="0" x2="0" y1="${-SL}" y2="${SL}"/><line class="net" x1="-6.2" x2="6.2" y1="0" y2="0"/>`;
  g += a.filter(s => isN(s.x) && isN(s.y)).map(s => `<circle class="p" cx="${s.x.toFixed(2)}" cy="${s.y.toFixed(2)}" r=".2"/>`).join("");
  g += a.filter(s => isN(s.shotX) && isN(s.shotY)).map(s => `<circle class="p${s.shotIn === false ? " out" : ""}" cx="${s.shotX.toFixed(2)}" cy="${(-(s.shotY - HL)).toFixed(2)}" r=".2"/>`).join("");
  const pos = a.filter(s => isN(s.y)), shots = a.filter(s => isN(s.shotY));
  $("sub").innerHTML = `<div class="grid2" style="margin-top:12px"><div class="card court"><svg viewBox="-6.5 -13.5 13 31" role="img" aria-label="Pista">${g}</svg></div>
  <div class="card"><h3>En la pista</h3><div class="grid2" style="margin-top:8px"><div class="stat"><b class="num">${fmt(100 * pos.filter(s => s.y > HL).length / Math.max(1, pos.length))} %</b><span>golpea detrás de la línea de fondo</span></div><div class="stat"><b class="num">${fmt(100 * pos.filter(s => s.x > 0).length / Math.max(1, pos.length))} %</b><span>en la mitad de su derecha</span></div><div class="stat"><b class="num">${shots.length}</b><span>golpes con bote visto</span></div><div class="stat"><b class="num">${fmt(100 * shots.filter(s => s.shotIn === false).length / Math.max(1, shots.length))} %</b><span>fuera</span></div></div><p class="sub" style="margin-top:10px">Abajo, dónde golpea; arriba, dónde bota su golpe (rojo: fuera).</p></div></div>`;
}
function tabla() {
  const a = strokesNow().slice(0, 60);
  $("sub").innerHTML = `<div class="card scroll" style="margin-top:12px"><table class="t"><tr><th>Golpe</th><th>Apoyo</th><th>Cómo llega</th><th>Bola</th><th>Resultado</th><th>Captura</th></tr>${a.map(s => `<tr class="clickable" data-stroke="${esc(s.id)}"><td>${esc(title(s))}</td><td>${esc(s.stance || "—")}</td><td>${esc(s.movement || "—")}</td><td>${s.bits.map(esc).join(", ") || "—"}</td><td>${esc(s.detail || s.outcome || "—")}</td><td class="num">${fmt(100 * (s.quality ?? 0))} %</td></tr>`).join("")}</table><p class="mock" style="margin-top:8px">Los 60 primeros con el orden de Sus golpes; la aplicación los pagina.</p></div>`;
}
function lateral() { $("sub").innerHTML = `<div class="card" style="margin-top:12px"><h3>Vista lateral (entreno)</h3><p class="sub">Apartado aparte y marcado (requisito 6): vídeos de entrenamiento de la propia jugadora filmados de lado, solo para lo que la tele no ve (impacto por delante de la cadera, ángulo del swing). Nunca se mezcla con los datos de partido.</p></div>`; }
function fiabilidad() {
  const R = Object.entries(D.reliability);
  $("sub").innerHTML = `<div class="card scroll" style="margin-top:12px"><h3>Fiabilidad de cada medida</h3><p class="sub">Ruido de medida frente a la dispersión de sus golpes; una diferencia solo se enseña si supera el ruido.</p><table class="t"><tr><th>Medida</th><th>Golpes</th><th>Ruido</th><th>Dispersión</th><th>Veredicto</th></tr>${R.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.n ?? "—"}</td><td class="num">${isN(v.noise) ? fmt(v.noise, 2) : "—"}</td><td class="num">${isN(v.spread) ? fmt(v.spread, 2) : "—"}</td><td>${verdictPill(v.verdict)}</td></tr>`).join("")}</table></div>`;
}
function datos() { const r = D.run_info || {}; $("sub").innerHTML = `<div class="grid2" style="margin-top:12px"><div class="card"><h3>Diferencias conocidas de la beta</h3><ul>${D.known.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="card"><h3>El análisis</h3><table class="t"><tr><td>Vídeo analizado</td><td class="num">${fmt(r.video_min)} min</td></tr><tr><td>Tiempo de análisis</td><td class="num">${fmt(r.analysis_min)} min</td></tr><tr><td>Generado</td><td>${esc(D.generated || "—")}</td></tr></table></div></div>`; }
function exportar() { $("sub").innerHTML = `<div class="card" style="margin-top:12px"><h3>Exportar</h3><p class="sub">Un PDF corto con lo esencial y los MP4 de los golpes o de una lista de reproducción (#41, #46).</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" type="button">PDF corto</button><button class="btn" type="button">MP4 de esta selección</button></div><p class="mock" style="margin-top:10px">Maqueta: la exportación existe hoy en el PC; en la aplicación se guarda en la carpeta que elijas.</p></div>`; }

show(location.hash.slice(1) || "inicio");
</script>
