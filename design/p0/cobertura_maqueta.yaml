# #305 (15-11): what the P0 mockup must show, by source, beyond what design/p0/validar_maqueta.py reads by itself
# (docs/matriz_cobertura.md, the taxonomy and the user's 15-point list, by measure keys; config/referencias.yaml, the
# patterns). Each item: what is asked, where it comes from, and where in the walked mockup it must be visible
# (`busca`: any of these patterns, ignoring case; `en`: only in these screens, by name prefix; `todos`: every pattern
# must be found in one same screen). `tipo`: debe (the mockup must show it) · hueco (asked, planned in a later
# package: reported, not required now).
fuentes:
  requisitos: "CLAUDE.md, requisitos del usuario 1-10, vistas pedidas, informe y salida visual"
  ivanovic: "Guía «Derecha estilo Ivanovic», sus 20 huecos (docs/comparacion_guia_ivanovic.md §3)"
  entrenadores: "Lo aprendido de los entrenadores (docs/aprendido_entrenadores.md §3, §5 Joel Myers, §6 The Tennis Mentor)"
  ux: "Usabilidad y aprendizaje (heurísticas de Nielsen, modelo de calidad P0.2)"
items:
