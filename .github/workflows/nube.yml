# N0 (13-11, #273): la prueba de la nube. Solo se lanza a mano (o Claude con las herramientas de GitHub): nunca con un
# push. Usa la clave de Modal del usuario (secretos MODAL_TOKEN_ID y MODAL_TOKEN_SECRET del repositorio); el tope de
# la cuenta de Modal en su credito mensual deja cada mes en 0 euros (docs/nube_n0.md). El PC no interviene.
#   comprobar: despliega y mira la GPU, CUDA, los modelos y los datos subidos (minutos)
#   f3set:     despliega y lanza la validacion F3Set en la nube; vuelve al momento (la ejecucion sigue alli)
#   prueba:    10 minutos de cada partido dado, analizados como un partido (minutos y centimos)
#   partidos:  despliega y lanza los partidos dados (cada uno en su contenedor, a la vez); vuelve al momento
#   informe:   el informe y la auditoria de la Base de los partidos ya analizados (solo CPU; recoger con su tag)
#   parar:     cancela en la nube los trabajos dados por su identificador (fc-..., el que imprime cada lanzamiento)
#   diagnostico: que ffmpeg limpia el .ts de cada partido dado (solo CPU, centimos; recoger con tag diag_ts)
#   recoger:   trae el estado, el registro y la comparacion con el PC de una ejecucion (runs/<tag>; un partido:
#              runs/partido_<id>)
#   kaggle_comprobar: (14-11, paso 8b) una sesion de Kaggle que mira GPU, nucleos, disco, la clave de Modal y monta el
#              entorno; espera a que acabe y trae su salida
#   kaggle_sin_clave: (diagnostico, 14-11) la comprobacion sin el conjunto de datos de la clave (una sesion que se quedo
#              en cola: ¿es por el?); falla al bajar de Modal, pero dice si arranca
#   kaggle_estado: el estado de la ultima sesion de Kaggle y, si acabo, su salida (no lanza nada)
#   kaggle_prueba: 10 min del partido dado en Kaggle, con sus resultados aparte en Modal (/kaggle_comparar) para
#              compararlos con la prueba de Modal; espera a que acabe y trae su salida
name: Nube
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "comprobar | f3set | prueba | partidos | diagnostico | informe | parar | recoger | kaggle_comprobar | kaggle_prueba | kaggle_estado | kaggle_sin_clave"
        type: choice
        options: [comprobar, f3set, prueba, partidos, diagnostico, informe, parar, recoger, kaggle_comprobar, kaggle_prueba, kaggle_estado, kaggle_sin_clave]
        default: comprobar
      tag:
        description: "nombre de la ejecucion (runs/<tag>)"
        type: string
        default: nube
      max_points:
        description: "puntos por partido (0 = todos)"
        type: string
        default: "0"
      pc_tag:
        description: "la ejecucion del PC con la que se compara"
        type: string
        default: v17
      partidos:
        description: "partidos: sus id separados por comas (cada uno en su contenedor, a la vez)"
        type: string
        default: ""
      llamadas:
        description: "parar: los fc-... de los trabajos a cancelar, separados por comas"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: nube-${{ inputs.accion }}
  cancel-in-progress: false
jobs:
  nube:
    if: github.repository_owner == 'estebancobo-dot'
    runs-on: ubuntu-latest
    # 14-11: a Kaggle run is waited for here (a 10-minute test takes about 1-2 h there)
    timeout-minutes: ${{ startsWith(inputs.accion, 'kaggle') && 240 || 60 }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      # tal como el usuario los pego (13-11: con espacios, "Token ID is malformed"); el paso "Clave de Modal" saca de
      # ellos las dos claves, ak-... y as-..., aunque se pegara el comando entero que ensena Modal o al reves
      CLAVE_MODAL_1: ${{ secrets.MODAL_TOKEN_ID }}
      CLAVE_MODAL_2: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUTF8: "1"
    steps:
      - name: Clave de Modal
        run: |
          todo="$CLAVE_MODAL_1 $CLAVE_MODAL_2"
          id=$(printf '%s' "$todo" | grep -oE 'ak-[A-Za-z0-9]+' | head -n 1 || true)
          sec=$(printf '%s' "$todo" | grep -oE 'as-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -z "$id" ] || [ -z "$sec" ]; then
            echo "Los secretos MODAL_TOKEN_ID y MODAL_TOKEN_SECRET no contienen una clave de Modal (ak-... y as-...)"
            exit 1
          fi
          echo "::add-mask::$id"
          echo "::add-mask::$sec"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$sec" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cliente de Modal
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.0,<2" pyyaml
      - name: Desplegar
        if: inputs.accion != 'recoger' && inputs.accion != 'parar' && !startsWith(inputs.accion, 'kaggle')
        run: modal deploy cloud/modal_app.py
      - name: Comprobar
        if: inputs.accion == 'comprobar'
        # 13-11: primero sin GPU (ping: si arranca, una espera es de la GPU); con limite de tiempo; si algo no
        # termina, los registros de Modal de la aplicacion
        run: |
          rc=0
          echo "===== ping (sin GPU)"; timeout 420 python cloud/lanzar.py ping || rc=1
          echo "===== comprobar (GPU)"; timeout 900 python cloud/lanzar.py comprobar || rc=1
          if [ "$rc" != "0" ]; then echo "===== registros de Modal"; timeout 90 modal app logs tennisbio || true; fi
          exit $rc
      - name: Lanzar F3Set
        if: inputs.accion == 'f3set'
        run: python cloud/lanzar.py f3set --tag "${{ inputs.tag }}" --max-points "${{ inputs.max_points }}" --pc-tag "${{ inputs.pc_tag }}"
      - name: Lanzar prueba (10 min de cada partido dado)
        if: inputs.accion == 'prueba'
        run: python cloud/lanzar.py prueba --partidos "${{ inputs.partidos }}"
      - name: Lanzar partidos
        if: inputs.accion == 'partidos'
        run: python cloud/lanzar.py partidos --partidos "${{ inputs.partidos }}"
      - name: Lanzar diagnostico del .ts
        if: inputs.accion == 'diagnostico'
        run: python cloud/lanzar.py diagnostico --partidos "${{ inputs.partidos }}"
      - name: Lanzar informe y auditoria
        if: inputs.accion == 'informe'
        env:
          TAG: ${{ inputs.tag }}
        run: python cloud/lanzar.py informe --tag "$TAG"
      - name: Parar trabajos
        if: inputs.accion == 'parar'
        env:
          LLAMADAS: ${{ inputs.llamadas }}
        run: python cloud/lanzar.py parar --llamadas "$LLAMADAS"
      - name: Kaggle
        if: startsWith(inputs.accion, 'kaggle')
        env:
          ACCION: ${{ inputs.accion }}
          PARTIDO: ${{ inputs.partidos }}
          TAG: ${{ inputs.tag }}
        run: |
          # 14-11: the kaggle package does not declare «six», which it imports («No module named 'six'»)
          pip install -q "kaggle>=1.8" six
          if [ "$ACCION" = "kaggle_estado" ]; then
            # 14-11: the real GPU quota and every recent version's status (why Kaggle starts nothing)
            python cloud/kaggle/diagnostico.py || true
            python cloud/kaggle/cuaderno.py estado
            python cloud/kaggle/cuaderno.py salida --dir nube-out/kaggle || true
            exit 0
          fi
          # 14-11: the notebook's secrets do not reach a run started by the API: the Modal key goes in a private dataset
          if [ "$ACCION" != "kaggle_sin_clave" ]; then python cloud/kaggle/cuaderno.py clave; fi
          if [ "$ACCION" = "kaggle_sin_clave" ]; then
            python cloud/kaggle/cuaderno.py lanzar --accion comprobar --commit "$GITHUB_SHA" --sin-clave
            minutos=15
          elif [ "$ACCION" = "kaggle_comprobar" ]; then
            python cloud/kaggle/cuaderno.py lanzar --accion comprobar --commit "$GITHUB_SHA"
            minutos=50
          else
            python cloud/kaggle/cuaderno.py lanzar --accion prueba --partido "$PARTIDO" --commit "$GITHUB_SHA" \
              --salida-remota "/runs/$TAG" --output-remoto /kaggle_comparar/output
            minutos=220
          fi
          sleep 60
          rc=0; python cloud/kaggle/cuaderno.py esperar --minutos "$minutos" || rc=$?
          python cloud/kaggle/cuaderno.py salida --dir nube-out/kaggle || true
          exit $rc
      - name: Recoger
        if: inputs.accion == 'recoger'
        run: |
          modal volume ls tennisbio-datos /runs || true
          modal volume ls tennisbio-datos "/runs/${{ inputs.tag }}" || true
          # 13-11: into a folder that exists (without it, every file was written over the same file "nube-out")
          mkdir -p nube-out
          modal volume get --force tennisbio-datos "/runs/${{ inputs.tag }}" nube-out/
          # 13-11: modal volume get deja la carpeta dentro de nube-out: se busca en todo nube-out
          find nube-out -type f | head -50
          for f in $(find nube-out -name estado.json -o -name comparacion.md); do echo "===== $f"; cat "$f"; done
          for f in $(find nube-out -name log.txt); do echo "===== $f (ultimas 120 lineas)"; tail -n 120 "$f"; done
          # 14-11: for a match, also each stage's summary from its manifest (strokes, forehands, faults)
          case "$TAG" in
            partido_*)
              modal volume get --force tennisbio-datos "/output/${TAG#partido_}/manifest.json" nube-out/manifest.json || true
              python cloud/resumen.py nube-out/manifest.json || true
              ;;
            kaggle_prueba_*)
              # 14-11: a Kaggle test keeps its results apart (/kaggle_comparar), to compare them with Modal's own test
              for d in $(modal volume ls tennisbio-datos /kaggle_comparar/output | grep -o '_prueba_[A-Za-z0-9._-]*' | sort -u); do
                modal volume get --force tennisbio-datos "/kaggle_comparar/output/$d/manifest.json" "nube-out/manifest_kaggle_$d.json" || true
                python cloud/resumen.py "nube-out/manifest_kaggle_$d.json" || true
              done
              ;;
          esac
        env:
          TAG: ${{ inputs.tag }}
      - name: Guardar lo recogido
        if: always() && (inputs.accion == 'recoger' || startsWith(inputs.accion, 'kaggle'))
        uses: actions/upload-artifact@v4
        with:
          name: nube-${{ inputs.tag }}
          path: nube-out
          if-no-files-found: ignore
