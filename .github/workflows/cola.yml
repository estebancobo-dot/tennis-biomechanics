# Paso 8 (14-11, #281-#283): la cola de trabajos de la nube, cada 30 minutos y sin ninguna sesión de chat.
# Lee config/cola_nube.yaml, mira lo que está en marcha, lanza lo pendiente donde haya sitio gratis (cloud/cola.py) y
# deja el estado en la rama nube-logs (cola/estado.md, estado.json, gasto.json, partidos.json). Repositorio público:
# los minutos de GitHub Actions no cuestan nada.
# 14-11 10:45: in its first two hours GitHub never ran the schedule (only the runs started by hand), so the queue does
# not depend on it: while any job is unfinished, each run starts the next one 25 minutes later («Siguiente vuelta»);
# a change to the queue and the end of a «Nube» run also start one. The schedule stays as a further backup.
# 14-11 18:00: the heartbeat's sleep sat inside the queue's single slot, so a push waited up to 25 minutes behind it.
# Now the pass («cola», one at a time, never cancelled) and the heartbeat («latido», only the newest kept) are two jobs:
# a push or a «Nube» run that ends starts a pass at once, and its heartbeat replaces the sleeping one.
name: Cola
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [claude/tennis-biomech-setup-jggqb0]
    paths: [config/cola_nube.yaml]
  workflow_run:
    workflows: [Nube]
    types: [completed]
permissions:
  contents: write
  actions: write
  pull-requests: write          # #291: the mailbox pull request's comments wake Claude
  issues: write
jobs:
  cola:
    if: github.repository_owner == 'estebancobo-dot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cola
      cancel-in-progress: false
    outputs:
      sin_terminar: ${{ steps.cuenta.outputs.sin_terminar }}
      en_marcha: ${{ steps.cuenta.outputs.en_marcha }}
    env:
      CLAVE_MODAL_1: ${{ secrets.MODAL_TOKEN_ID }}
      CLAVE_MODAL_2: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Clave de Modal
        run: |
          todo="$CLAVE_MODAL_1 $CLAVE_MODAL_2"
          id=$(printf '%s' "$todo" | grep -oE 'ak-[A-Za-z0-9]+' | head -n 1 || true)
          sec=$(printf '%s' "$todo" | grep -oE 'as-[A-Za-z0-9]+' | head -n 1 || true)
          if [ -z "$id" ] || [ -z "$sec" ]; then
            echo "Los secretos MODAL_TOKEN_ID y MODAL_TOKEN_SECRET no contienen una clave de Modal (ak-... y as-...)"
            exit 1
          fi
          echo "::add-mask::$id"
          echo "::add-mask::$sec"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$sec" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Rama nube-logs
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" nube-logs >/dev/null; then
            git clone -q --depth 1 --branch nube-logs "$url" logs
          else
            mkdir logs && git -C logs init -q -b nube-logs && git -C logs remote add origin "$url"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cliente de Modal
        # the kaggle package imports «six» without declaring it
        run: pip install "modal>=1.0,<2" pyyaml "kaggle>=1.8" six
      - name: Una vuelta de la cola
        run: python cloud/cola.py --cola config/cola_nube.yaml --logs logs --avisos avisos.md
      - name: Subir el estado a nube-logs
        if: always()
        run: |
          cd logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "cola: $(date -u '+%Y-%m-%d %H:%M')" || exit 0
          git push -q origin HEAD:nube-logs
      - name: Avisar a Claude
        # #291 (14-11, the user: wake at once, no polling, no tokens while nothing happens): only when a job has just
        # finished, failed or stopped in «revisar» (or Kaggle refused a launch), a comment on the mailbox pull request,
        # whose activity wakes Claude's session at that moment
        if: always()
        run: |
          pr=$(python -c "import yaml; print((yaml.safe_load(open('config/cola_nube.yaml',encoding='utf-8')) or {}).get('avisos_pr') or '')")
          if [ -s avisos.md ] && [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file avisos.md && echo "avisado en el PR $pr"
          else
            echo "nada que avisar"
          fi
      - name: Cuenta
        id: cuenta
        if: always()
        run: |
          read left running < <(python -c "import json,os,yaml; q=yaml.safe_load(open('config/cola_nube.yaml',encoding='utf-8')) or {}; st=json.load(open('logs/cola/estado.json',encoding='utf-8')) if os.path.exists('logs/cola/estado.json') else {}; ids=[j.get('id') for j in q.get('trabajos') or []]; print(sum(1 for i in ids if st.get(i,{}).get('estado') not in ('hecho','error')), sum(1 for i in ids if st.get(i,{}).get('estado')=='en_marcha'))")
          echo "trabajos sin terminar: $left; en marcha: $running"
          echo "sin_terminar=$left" >> "$GITHUB_OUTPUT"
          echo "en_marcha=$running" >> "$GITHUB_OUTPUT"
          # #291: the summary (with the progress of what runs) on the run's own page in GitHub Actions
          if [ -f logs/cola/estado.md ]; then cat logs/cola/estado.md >> "$GITHUB_STEP_SUMMARY"; fi
  latido:
    needs: cola
    if: always() && github.repository_owner == 'estebancobo-dot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cola-latido
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      SIN_TERMINAR: ${{ needs.cola.outputs.sin_terminar }}
      EN_MARCHA: ${{ needs.cola.outputs.en_marcha }}
    steps:
      - name: Siguiente vuelta
        if: always()
        run: |
          # a pass that failed before counting (no outputs) still gets its next pass, 25 minutes later
          left="${SIN_TERMINAR:-1}"; running="${EN_MARCHA:-0}"
          echo "trabajos sin terminar: $left; en marcha: $running"
          if [ "$left" -gt 0 ]; then
            # 14-11 (the user: be reactive): every 5 minutes while something runs (a failure is seen in minutes, a
            # session stuck in Kaggle's queue is relaunched after 45), every 25 while jobs only wait for room
            if [ "$running" -gt 0 ]; then sleep 300; else sleep 1500; fi
            gh workflow run cola.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-claude/tennis-biomech-setup-jggqb0}"
          fi
